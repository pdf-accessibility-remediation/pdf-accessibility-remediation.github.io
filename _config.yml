# The pages come from docs/ in the source repo; .github/workflows/pages.yml copies them in.
title: PDF Accessibility Remediation
description: Documentation for the PDF accessibility remediation pipeline
url: https://pdf-accessibility-remediation.github.io

remote_theme: just-the-docs/just-the-docs@v0.10.1
plugins:
  - jekyll-remote-theme
  - jekyll-relative-links

relative_links:
  enabled: true
  collections: false

color_scheme: green  # _sass/color_schemes/green.scss

search_enabled: true
heading_anchors: true

aux_links:
  "Source on GitHub":
    - "https://github.com/pdf-accessibility-remediation/pdf-accessibility-remediation"

# "Edit this page" opens docs/ in the source repo, not this one
gh_edit_link: true
gh_edit_link_text: "Edit this page on GitHub"
gh_edit_repository: "https://github.com/pdf-accessibility-remediation/pdf-accessibility-remediation"
gh_edit_branch: "main"
gh_edit_source: docs
gh_edit_view_mode: "edit"

exclude:
  - README.md
  - script/
